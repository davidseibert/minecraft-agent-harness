name: AgentMonitor
version: 0.1.0
main: dev.agentharness.monitor.AgentMonitorPlugin
api-version: '1.21'
description: Watch agents from inside the game
commands:
  watch:
    description: Show agents, toggle the feed and sidebar, spectate or teleport
    usage: /watch [dms|failures|deaths|tools|sidebar|tp <agent>|spectate <agent>|back]
    permission: agentmonitor.watch
  inv:
    description: View an agent's inventory (read-only)
    usage: /inv <agent>
    permission: agentmonitor.watch
permissions:
  agentmonitor.watch:
    description: See the sidebar and feed, and use the monitor commands
    default: op
